
plugins { id 'com.android.application'; id 'com.google.gms.google-services' }
android {
    namespace 'com.vulnfusion'; compileSdk 34
    defaultConfig {
        applicationId "com.vulnfusion"; minSdk 24; targetSdk 34
        versionCode 8; versionName "8.0 Diamond"
        buildConfigField "String", "OPENAI_API_KEY", ""sk-proj-REPLACE_ME""
    }
    buildFeatures { buildConfig true }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'com.google.firebase:firebase-auth:23.0.0'
    implementation 'com.google.firebase:firebase-firestore:24.10.0'
    implementation 'com.google.android.gms:play-services-auth:20.7.0'
    implementation 'com.theokanning.openai-gpt3-java:service:0.18.2'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
}
